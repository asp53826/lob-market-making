[project]
name = "lob-market-making"
version = "0.1.0"
description = "Limit order book, market-making strategies, and adverse-selection measurement"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lob"]

[tool.pytest.ini_options]
testpaths = ["tests"]
